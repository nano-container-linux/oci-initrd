name: Build initrd

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # A planted xz bomb (a header declaring 1.5 GiB over a few bytes) must cost
  # kilobytes. Run as a compiled binary under a virtual-memory limit and
  # GOMEMLIMIT, so that a regression fails by itself instead of allocating
  # gigabytes of the runner.
  bombs:
    name: bombs (ulimit -v, GOMEMLIMIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -c -o xzopen.test ./internal/xzopen
      - name: run under limits
        run: |
          ulimit -v 2097152
          GOMEMLIMIT=256MiB ./xzopen.test -test.v

  build-initrd:
    name: Build initrd (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          # Without it the action asks the GitHub API for Task's releases
          # anonymously, and shares the runner IP's 60/h with everyone on it:
          # main went red on "API rate limit exceeded for 40.65.61.147".
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install initrd dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip

      - name: Build initrd
        run: task build ARCH=${{ matrix.arch }}

      - name: Upload initrd artifact
        uses: actions/upload-artifact@v7
        with:
          name: initrd-${{ matrix.arch }}
          path: out/initrd-oci-${{ matrix.arch }}.gz
          if-no-files-found: error

      - name: Upload init binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: init-binary-${{ matrix.arch }}
          path: out/init
          if-no-files-found: error
